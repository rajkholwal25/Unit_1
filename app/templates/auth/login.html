{% extends 'layouts/base.html' %}
{% block content %}
<div class="auth-layout">
  <div class="auth-card">
    <div class="auth-card-header">
      <div class="auth-logo">U1</div>
      <h1 class="h4 mb-1 fw-bold">{{ site_title }}</h1>
      <p class="text-muted small mb-0">Sign in to your workspace</p>
    </div>
    <div class="auth-card-body">
      <form method="post" action="{{ url_for('auth.login') }}" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input id="email" name="email" value="{{ email or '' }}" class="form-control" placeholder="you@company.com" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign in
        </button>
      </form>
      <p class="text-muted small mt-3 mb-0 text-center">
        Default: <code>manager@test.com</code> / <code>test@123</code>
      </p>
    </div>
  </div>
</div>
{% endblock %}
