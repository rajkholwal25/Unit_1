{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">Item Code Generator</h1>
  <p class="page-subtitle">Generate finished-good and process item codes, then save or push to SAP.</p>
</div>

<div class="panel">
  <div class="panel-header">Configuration</div>
  <div class="panel-body">
    <form id="genForm" class="row g-3" onsubmit="return false;">
      <div class="col-md-6 col-lg-3">
        <label class="form-label" for="material_type">Material type</label>
        <select id="material_type" class="form-select">
          <option value="">Select material</option>
          {% for m in materials %}
          <option value="{{ m.code }}">{{ m.code }} — {{ m.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6 col-lg-2">
        <label class="form-label" for="thickness">Thickness</label>
        <input id="thickness" class="form-control" value="12">
      </div>
      <div class="col-md-6 col-lg-3 position-relative">
        <label class="form-label" for="pattern_input">Pattern</label>
        <input id="pattern_input" class="form-control" placeholder="Type name or code">
        <input type="hidden" id="pattern_id" name="pattern_id">
        <ul id="pattern_suggestions" class="list-group position-absolute w-100" style="z-index:1050; display:none; max-height:200px; overflow:auto; top:100%;"></ul>
      </div>
      <div class="col-md-6 col-lg-3">
        <label class="form-label" for="template_id">Template</label>
        <select id="template_id" class="form-select">
          <option value="">Select template</option>
          {% for t in templates %}
          <option value="{{ t.id }}">{{ t.template_name }} — {{ t.process_sequence }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12 col-lg-1 d-flex align-items-end">
        <button type="button" class="btn btn-primary w-100" onclick="generate()">
          <i class="bi bi-lightning-charge me-1"></i> Generate
        </button>
      </div>
    </form>
  </div>
</div>

<div id="preview" class="preview-panel" style="display:none;">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
    <div>
      <div class="text-muted small text-uppercase fw-semibold mb-1">FG item code</div>
      <div class="fg-code" id="fgcode"></div>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <button type="button" class="btn btn-success" onclick="saveLocal()"><i class="bi bi-save me-1"></i> Save locally</button>
      <button type="button" class="btn btn-warning" onclick="pushSAP()"><i class="bi bi-cloud-upload me-1"></i> Push to SAP</button>
    </div>
  </div>
  <div class="row g-3">
    <div class="col-md-5">
      <h6 class="fw-semibold mb-2">Process items</h6>
      <ul id="processes" class="list-group list-group-flush border rounded"></ul>
    </div>
    <div class="col-md-7">
      <h6 class="fw-semibold mb-2">BOM chain</h6>
      <pre id="bomchain" class="mb-0"></pre>
    </div>
  </div>
</div>

<script>
function debounce(fn, wait){
  let t;
  return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), wait); }
}

async function fetchSuggest(q){
  q = q || '';
  try{
    const res = await fetch('/patterns/search?q='+encodeURIComponent(q));
    const data = await res.json();
    renderSuggestions(data.results || []);
  }catch(e){ hideSuggestions(); }
}

function renderSuggestions(items){
  const ul = document.getElementById('pattern_suggestions'); ul.innerHTML='';
  if(!items.length){ hideSuggestions(); return; }
  items.forEach(it=>{
    const li = document.createElement('li');
    li.className='list-group-item list-group-item-action';
    li.textContent = `${it.pattern_name} (${it.pattern_code})`;
    li.onclick = ()=> selectSuggestion(it.id, it.pattern_name, it.pattern_code);
    ul.appendChild(li);
  });
  ul.style.display='block';
}

function hideSuggestions(){ document.getElementById('pattern_suggestions').style.display='none'; }
function selectSuggestion(id, name, code){
  document.getElementById('pattern_input').value = code;
  document.getElementById('pattern_id').value = id;
  hideSuggestions();
}

async function createOrSelectPattern(name){
  name = name.trim(); if(!name) return null;
  try{
    const res = await fetch('/patterns/search?q='+encodeURIComponent(name));
    const data = await res.json();
    const exact = (data.results||[]).find(r => (r.pattern_code && String(r.pattern_code) === name) || (r.pattern_name && r.pattern_name.toLowerCase() === name.toLowerCase()));
    if(exact){ selectSuggestion(exact.id, exact.pattern_name, exact.pattern_code); return exact; }
    const post = await fetch('/patterns/ajax_create', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pattern_name: name})});
    const body = await post.json();
    if(post.status===201 || post.status===200){ selectSuggestion(body.id, body.pattern_name, body.pattern_code); return body; }
  }catch(e){ console.error(e); }
  return null;
}

const input = document.getElementById('pattern_input');
input.addEventListener('input', debounce(function(){ document.getElementById('pattern_id').value=''; fetchSuggest(this.value); }, 250));
input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); createOrSelectPattern(this.value); } if(e.key==='Escape'){ hideSuggestions(); } });
input.addEventListener('focus', function(){ fetchSuggest(this.value); });

function generate(){
  const payload = new URLSearchParams();
  payload.append('material_type', document.getElementById('material_type').value);
  payload.append('thickness', document.getElementById('thickness').value);
  payload.append('pattern_id', document.getElementById('pattern_id').value);
  payload.append('template_id', document.getElementById('template_id').value);
  fetch('/item-generator/generate',{method:'POST',body:payload}).then(r=>r.json()).then(d=>{
    document.getElementById('preview').style.display='block';
    document.getElementById('fgcode').innerText = d.fg_code;
    const proc = document.getElementById('processes'); proc.innerHTML='';
    d.process_items.forEach(p=>{
      const li=document.createElement('li');
      li.className='list-group-item font-monospace small';
      li.innerText=p;
      proc.appendChild(li);
    });
    document.getElementById('bomchain').innerText = JSON.stringify(d.bom_chain, null, 2);
    window._lastPreview = {fg_code:d.fg_code, process_items:d.process_items, bom_chain:d.bom_chain, material_type:document.getElementById('material_type').value, thickness:document.getElementById('thickness').value, pattern_id:document.getElementById('pattern_id').value, template_id:document.getElementById('template_id').value};
    document.getElementById('preview').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

function saveLocal(){
  fetch('/item-generator/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(window._lastPreview)})
    .then(r=>r.json())
    .then(d=>{
      if(d && (d.success || d.id)) showAlert('Item codes saved successfully', 'success');
      else showAlert('Save completed', 'success');
    }).catch(()=> showAlert('Save failed','danger'));
}

function pushSAP(){
  fetch('/item-generator/push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(window._lastPreview)})
    .then(r=>r.json())
    .then(d=>{
      if(d && d.status && d.status.toLowerCase()==='ok') showAlert('Push to SAP successful','success');
      else showAlert('Push result: '+(d.status||d.error||'unknown'), 'warning');
    }).catch(()=> showAlert('Push failed','danger'));
}

function showAlert(message, type){
  const div = document.createElement('div');
  div.className = `alert alert-${type} position-fixed shadow`;
  div.style.cssText = 'right:20px;top:20px;z-index:2000;min-width:240px;';
  div.innerHTML = message + '<button type="button" class="btn-close ms-2" onclick="this.parentElement.remove()"></button>';
  document.body.appendChild(div);
  setTimeout(()=> div.remove(), 3500);
}
</script>
{% endblock %}
