{% extends 'base.html' %}
{% block title %}Create GRN — {{ site_title }}{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title"><i class="bi bi-upc-scan me-2"></i>Create GRN Number</h1>
</div>

<div class="panel" style="max-width: 720px;">
  <div class="panel-header">Roll details</div>
  <div class="panel-body">
    <form method="POST" class="vstack gap-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div>
        <label class="form-label" for="supplier_name">Supplier Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="supplier_name" name="supplier_name" maxlength="200" required
               value="{{ form_data.get('supplier_name', '') }}">
      </div>

      <div>
        <label class="form-label" for="supplier_roll_number">Roll Number <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="supplier_roll_number" name="supplier_roll_number" maxlength="100" required
               value="{{ form_data.get('supplier_roll_number', '') }}" placeholder="Supplier's roll ID">
        <div class="form-text">Roll number from the supplier (your system will assign the GRN number).</div>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="film_type">Film Type <span class="text-danger">*</span></label>
          <select class="form-select" id="film_type" name="film_type" required>
            <option value="">Select film type</option>
            {% for m in materials %}
            <option value="{{ m.code }}"{% if form_data.get('film_type') == m.code %} selected{% endif %}>{{ m.code }} — {{ m.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="coating">Chemical Coating <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="coating" name="coating" maxlength="50" required
                 value="{{ form_data.get('coating', '') }}" placeholder="Type chemical coating">
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="width_mm">Width ({{ unit1_units.width }}) <span class="text-danger">*</span></label>
          <input type="text" inputmode="decimal" autocomplete="off" class="form-control" id="width_mm" name="width_mm"
                 data-decimal-input data-decimal-places="3" required
                 value="{{ form_data.get('width_mm', '') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="thickness_mic">Thickness ({{ unit1_units.thickness }}) <span class="text-danger">*</span></label>
          <input type="text" inputmode="decimal" autocomplete="off" class="form-control" id="thickness_mic" name="thickness_mic"
                 data-decimal-input data-decimal-places="3" required
                 value="{{ form_data.get('thickness_mic', '') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="length_mtr">Length ({{ unit1_units.length }}) <span class="text-danger">*</span></label>
          <input type="text" inputmode="decimal" autocomplete="off" class="form-control" id="length_mtr" name="length_mtr"
                 data-decimal-input data-decimal-places="3" required
                 value="{{ form_data.get('length_mtr', '') }}">
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="gross_weight_kg">Gross Weight (kg) <span class="text-danger">*</span></label>
          <input type="text" inputmode="decimal" autocomplete="off" class="form-control" id="gross_weight_kg" name="gross_weight_kg"
                 data-decimal-input data-decimal-places="3" required
                 value="{{ form_data.get('gross_weight_kg', '') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="net_weight_kg">Net weight (kg) <span class="text-danger">*</span></label>
          <input type="text" inputmode="decimal" autocomplete="off" class="form-control" id="net_weight_kg" name="net_weight_kg"
                 data-decimal-input data-decimal-places="3" required
                 value="{{ form_data.get('net_weight_kg', '') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="core_weight_kg">Core weight (kg)</label>
          <input type="text" inputmode="decimal" autocomplete="off" class="form-control" id="core_weight_kg" name="core_weight_kg"
                 data-decimal-input data-decimal-places="3"
                 value="{{ form_data.get('core_weight_kg', '') }}">
        </div>
      </div>

      <div class="d-flex gap-2 pt-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg me-1"></i>Create GRN Number
        </button>
        <a href="{{ url_for('roll_grn.index') }}" class="btn btn-outline-secondary">Created GRN Numbers</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
